{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "otel-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-app.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "otel-app.selectorLabels" . | nindent 6 }}
  podTargetLabels:
  - app.kubernetes.io/version
  endpoints:
  - port: http
    path: /metrics
    interval: {{ .Values.serviceMonitor.interval }}
    scheme: http
{{- end }}
