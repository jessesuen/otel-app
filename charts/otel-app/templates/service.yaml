apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "otel-app.selectorLabels" . | nindent 4 }}
