name: Chart Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version (e.g. 1.2.3)
        required: true

jobs:
  publish:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package chart
        run: |
          helm package charts/otel-app \
            --version ${{ inputs.version }} \
            --app-version ${{ inputs.version }}

      - name: Push chart
        run: |
          helm push otel-app-${{ inputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
